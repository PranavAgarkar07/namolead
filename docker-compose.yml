services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: namolead
      POSTGRES_USER: namolead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
  static: {}
  media: {}
