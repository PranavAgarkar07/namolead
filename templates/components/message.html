{% if level == "error" %}
  <div class="govuk-error-summary" role="alert" aria-labelledby="error-summary-title">
    <h2 class="govuk-error-summary__title" id="error-summary-title">There is a problem</h2>
    <p class="govuk-error-message">{{ message }}</p>
  </div>
{% elif level == "success" %}
  <div class="govuk-notification-banner govuk-notification-banner--success" role="status">
    <div class="govuk-notification-banner__header">
      <span class="govuk-notification-banner__title">Success</span>
    </div>
    <div class="govuk-notification-banner__content">
      <p class="govuk-body" style="margin-bottom: 0;">{{ message }}</p>
    </div>
  </div>
{% else %}
  <div class="govuk-notification-banner" role="status">
    <div class="govuk-notification-banner__header">
      <span class="govuk-notification-banner__title">Information</span>
    </div>
    <div class="govuk-notification-banner__content">
      <p class="govuk-body" style="margin-bottom: 0;">{{ message }}</p>
    </div>
  </div>
{% endif %}
