{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="govuk-breadcrumbs">
  <ol class="govuk-breadcrumbs__list">
    {% for crumb in breadcrumbs %}
      <li class="govuk-breadcrumbs__list-item">
        {% if crumb.url and not forloop.last %}
          <a href="{{ crumb.url }}" class="govuk-breadcrumbs__link">{{ crumb.title }}</a>
        {% else %}
          <span class="govuk-breadcrumbs__current" {% if forloop.last %}aria-current="page"{% endif %}>{{ crumb.title }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {% for crumb in breadcrumbs %}
    {"@type": "ListItem", "position": {{ forloop.counter }}, "name": "{{ crumb.title|escapejs }}"{% if crumb.url %}, "item": "{{ crumb.url|escapejs }}"{% endif %}{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
{% endif %}
