{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="mb-8">
  <ol class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
    {% for crumb in breadcrumbs %}
      {% if not forloop.first %}
        <li aria-hidden="true" class="text-[var(--ink-muted)]/50 select-none">/</li>
      {% endif %}
      <li>
        {% if crumb.url and not forloop.last %}
          <a href="{{ crumb.url }}" class="text-[var(--ink-muted)] hover:text-[var(--orange-strong)] transition-colors">{{ crumb.title }}</a>
        {% else %}
          <span class="text-[var(--ink)] font-medium" {% if forloop.last %}aria-current="page"{% endif %}>{{ crumb.title }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {% for crumb in breadcrumbs %}
    {"@type": "ListItem", "position": {{ forloop.counter }}, "name": "{{ crumb.title|escapejs }}"{% if crumb.url %}, "item": "{{ crumb.url|escapejs }}"{% endif %}}{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
{% endif %}
