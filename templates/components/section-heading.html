<div class="mb-8 border-t-2 border-[var(--ink)] pt-3">
  <div class="flex items-baseline justify-between gap-4">
    <div>
      {% if eyebrow %}<p class="text-[11px] uppercase tracking-[0.16em] font-bold text-[var(--orange-ink)] mb-1">{{ eyebrow }}</p>{% endif %}
      <h2 class="font-display text-[22px] sm:text-2xl font-bold tracking-[-0.02em] text-[var(--ink)]">{{ title }}</h2>
    </div>
    <span class="hidden sm:block h-px flex-1 bg-[var(--border)] ml-6" aria-hidden="true"></span>
  </div>
  {% if sub %}<p class="text-sm text-[var(--ink-muted)] mt-2 max-w-2xl leading-relaxed">{{ sub }}</p>{% endif %}
</div>
