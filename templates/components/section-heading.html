<div class="max-w-2xl mb-8">
  {% if eyebrow %}<p class="inline-flex items-center gap-2 text-[var(--orange-strong)] uppercase tracking-widest text-xs font-bold mb-2"><span class="w-2 h-2 bg-[var(--orange)]" aria-hidden="true"></span>{{ eyebrow }}</p>{% endif %}
  <h2 class="text-3xl font-semibold tracking-tight marker-link w-fit">{{ title }}</h2>
  {% if sub %}<p class="text-[var(--ink-muted)] mt-2">{{ sub }}</p>{% endif %}
</div>
