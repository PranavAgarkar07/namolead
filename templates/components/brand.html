{% load static %}
<a href="/" class="inline-flex items-center gap-2.5 group {% if big %}h-10 sm:h-11{% else %}h-8{% endif %}" aria-label="NamoLead — home">
  <img src="{% static 'img/namolead-logo.svg' %}" alt=""
       class="{% if dark %}hidden{% endif %} h-full w-auto transition-transform duration-300 group-hover:scale-[1.04]">
  <img src="{% static 'img/namolead-logo-light.svg' %}" alt=""
       class="{% if not dark %}hidden{% endif %} h-full w-auto transition-transform duration-300 group-hover:scale-[1.04]">
  <span class="wordmark {% if big %}text-[1.3rem] sm:text-[1.55rem] leading-none{% else %}text-lg leading-none{% endif %}">NamoLead</span>
</a>
