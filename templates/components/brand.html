{% load static %}
<a href="/" class="inline-flex items-center gap-2.5 group {% if big %}h-10 sm:h-11{% else %}h-8{% endif %}" aria-label="NamoLead — home">
  {% if dark %}
  <span class="bg-white flex items-center justify-center h-full aspect-square p-1 transition-transform duration-300 group-hover:scale-[1.04]">
    <img src="{% static 'img/namolead-logo.svg' %}" alt="" class="h-full w-auto object-contain">
  </span>
  {% else %}
  <span class="bg-white flex items-center justify-center h-full aspect-square p-1 border border-[var(--border)] shadow-sm transition-transform duration-300 group-hover:scale-[1.04]">
    <img src="{% static 'img/namolead-logo.svg' %}" alt="" class="h-full w-auto object-contain">
  </span>
  {% endif %}
  <span class="wordmark {% if big %}text-[1.3rem] sm:text-[1.55rem] leading-none{% else %}text-lg leading-none{% endif %}">NamoLead</span>
</a>
