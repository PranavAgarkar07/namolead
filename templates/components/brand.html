{% load static %}
<a href="/" class="inline-flex items-center gap-2.5 group {% if big %}h-10 sm:h-11{% else %}h-8{% endif %}" aria-label="NamoLead — home">
  {% if dark %}
  <span class="brand-icon bg-white flex items-center justify-center h-full aspect-square p-1.5 shadow-sm">
    <img src="{% static 'img/namolead-logo.svg' %}" alt="" class="h-full w-auto object-contain">
  </span>
  {% else %}
  <span class="brand-icon bg-white flex items-center justify-center h-full aspect-square p-1 border border-[var(--border)] shadow-sm">
    <img src="{% static 'img/namolead-logo.svg' %}" alt="" class="h-full w-auto object-contain">
  </span>
  {% endif %}
  <span class="wordmark {% if big %}text-[1.35rem] sm:text-[1.6rem] leading-none{% else %}text-[1.15rem] leading-none{% endif %}">Namo<span class="font-extrabold text-[var(--orange)]">Lead</span></span>
</a>
