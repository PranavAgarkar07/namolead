{% load static %}
<header class="govuk-header" role="banner">
  <div class="govuk-width-container">
    <div class="govuk-header__container">
      <a href="/" class="govuk-header__link" aria-label="NamoLead — Home">
        <span class="govuk-header__logotype">
          <span class="brand-box" style="background: #ffffff; border-radius: 8px; padding: 4px 6px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.22);">
            <img src="{% static 'img/namolead-logo.svg' %}" alt="NamoLead" width="34" height="34" class="brand-mark" style="display: block;">
          </span>
          <span class="govuk-header__logotype-text" style="color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">
            Namo<span style="color: #ff6b35;">Lead</span>
          </span>
        </span>
      </a>
      <div class="govuk-header__content">
        <span class="govuk-header__service-name" style="color: rgba(255,255,255,0.85); font-weight: 500;">Learn &middot; Lead &middot; Grow</span>
      </div>
    </div>
  </div>
</header>

<nav class="govuk-service-navigation" aria-label="Service information">
  <div class="govuk-width-container">
    <div class="govuk-service-navigation__container">
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Toggle navigation menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <ul class="govuk-service-navigation__list" id="nav-list">
        <li class="govuk-service-navigation__item">
          <a href="/" class="govuk-service-navigation__link" {% if request.path == '/' %}aria-current="page"{% endif %}>Home</a>
        </li>
        <li class="govuk-service-navigation__item">
          <a href="/opportunities/" class="govuk-service-navigation__link" {% if request.path == '/opportunities/' %}aria-current="page"{% endif %}>Opportunities</a>
        </li>
        <li class="govuk-service-navigation__item">
          <a href="/about/" class="govuk-service-navigation__link" {% if request.path == '/about/' %}aria-current="page"{% endif %}>About</a>
        </li>
        <li class="govuk-service-navigation__item">
          <a href="/team/" class="govuk-service-navigation__link" {% if request.path == '/team/' %}aria-current="page"{% endif %}>Team</a>
        </li>
        <li class="govuk-service-navigation__item">
          <a href="/events/" class="govuk-service-navigation__link" {% if request.path == '/events/' %}aria-current="page"{% endif %}>Events</a>
        </li>
        <li class="govuk-service-navigation__item nav-hide-mobile">
          <a href="https://chat.whatsapp.com/invite/namolead" target="_blank" rel="noopener" class="govuk-service-navigation__link">
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            WhatsApp
          </a>
        </li>
        <li class="govuk-service-navigation__item nav-hide-mobile">
          <a href="https://instagram.com/namoleads" target="_blank" rel="noopener" class="govuk-service-navigation__link">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            Instagram
          </a>
        </li>
        <li class="govuk-service-navigation__item nav-hide-mobile">
          <a href="https://www.linkedin.com/in/namo-lead-668278417" target="_blank" rel="noopener" class="govuk-service-navigation__link">
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
            LinkedIn
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<script>
  (function() {
    var btn = document.getElementById('nav-toggle');
    var list = document.getElementById('nav-list');
    if (btn && list) {
      btn.addEventListener('click', function() {
        var open = list.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.querySelector('i').className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
      });
    }
  })();
</script>
