<div class="nlc-empty-state">
  <div class="nlc-empty-state__icon" aria-hidden="true">
    <i class="fa-solid fa-magnifying-glass"></i>
  </div>
  <h3 class="nlc-empty-state__title">{{ title }}</h3>
  <p class="nlc-empty-state__body govuk-body">{{ body }}</p>
  {% if action_label %}
    <a href="{{ action_url|default:'/' }}" class="govuk-button govuk-button--secondary">{{ action_label }}</a>
  {% endif %}
</div>
