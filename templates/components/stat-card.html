<div
  {% if accent %}class="bg-[var(--surface-2)] border border-[var(--orange)] rounded-[var(--radius-lg)] p-4 shadow-[var(--shadow-sm)]"
  {% else %}class="bg-[var(--surface-2)] border border-[var(--border)] rounded-[var(--radius-lg)] p-4 shadow-[var(--shadow-sm)]"{% endif %}>
  <div class="text-sm text-[var(--ink-muted)]">{{ label }}</div>
  <div class="text-2xl font-bold text-[var(--navy)]">{{ value }}</div>
</div>
