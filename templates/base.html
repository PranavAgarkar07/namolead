<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NamoLead Opportunities{% endblock %}</title>
{% load static %}
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--surface)}</style>
{% block head %}{% endblock %}
</head>
<body class="bg-[var(--surface)] text-[var(--ink)] min-h-screen">
{% include "components/nav.html" %}
<main class="max-w-5xl mx-auto px-6 py-10">
{% if messages %}
  <div class="space-y-2 mb-6">
    {% for m in messages %}
      {% include "components/message.html" with message=m level=m.tags %}
    {% endfor %}
  </div>
{% endif %}
{% block content %}{% endblock %}
</main>
<footer class="border-t border-[var(--border)] text-center text-sm text-[var(--ink-muted)] py-6">
  NamoLead · <a href="https://instagram.com/namoleads" target="_blank" class="text-[var(--navy)] hover:text-[var(--orange)] underline">@namoleads</a>
</footer>
</body>
</html>
